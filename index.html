<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Proxy</title>
<style>
  :root {
    --bg: #f4f4f5; --bar: #ffffff; --text: #18181b; --muted: #71717a;
    --border: #e4e4e7; --accent: #2563eb; --input: #f4f4f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --bar: #18181b; --text: #fafafa; --muted: #a1a1aa;
      --border: #27272a; --accent: #3b82f6; --input: #27272a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }

  .bar { display: flex; gap: 6px; align-items: center; padding: 8px;
    background: var(--bar); border-bottom: 1px solid var(--border); }
  .bar button { border: 0; background: transparent; color: var(--text); cursor: pointer;
    width: 34px; height: 34px; border-radius: 8px; font-size: 16px; flex: none; }
  .bar button:hover { background: var(--input); }
  form { flex: 1; display: flex; min-width: 0; }
  #addr { flex: 1; min-width: 0; height: 34px; padding: 0 14px; border-radius: 17px;
    border: 1px solid transparent; background: var(--input); color: var(--text); font: inherit; outline: none; }
  #addr:focus { border-color: var(--accent); }

  main { flex: 1; position: relative; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  .home { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center; }
  .home h1 { margin: 0; font-size: 28px; font-weight: 650; }
  .home p { margin: 0; color: var(--muted); max-width: 34rem; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .links a { padding: 8px 14px; border-radius: 999px; background: var(--bar);
    border: 1px solid var(--border); color: var(--text); text-decoration: none; }
  .links a:hover { border-color: var(--accent); }
  .warn { background: #fef3c7; color: #78350f; padding: 12px 16px; border-radius: 10px; max-width: 34rem; display: none; }
</style>
</head>
<body>
  <div class="bar">
    <button id="back" title="Back">&#8592;</button>
    <button id="fwd" title="Forward">&#8594;</button>
    <button id="reload" title="Reload">&#8635;</button>
    <button id="homeBtn" title="Home">&#8962;</button>
    <form id="go"><input id="addr" placeholder="Type a URL or search…" autocomplete="off" spellcheck="false" autofocus></form>
    <button id="popout" title="Open page in its own tab">&#8599;</button>
  </div>
  <main>
    <div class="home" id="home">
      <h1>Local Proxy</h1>
      <p>Pages load through your proxy. Enter a web address, or anything else to search.</p>
      <div class="warn" id="fileWarn">
        You opened this file directly. Start the proxy first with
        <code>python3 proxy.py</code>, then use <b>http://127.0.0.1:8080</b>.
      </div>
      <div class="links">
        <a href="#" data-url="https://en.wikipedia.org">Wikipedia</a>
        <a href="#" data-url="https://news.ycombinator.com">Hacker News</a>
        <a href="#" data-url="https://html.duckduckgo.com/html/">DuckDuckGo</a>
        <a href="#" data-url="https://example.com">example.com</a>
      </div>
    </div>
    <iframe id="view" title="Proxied page"></iframe>
  </main>

<script>
  const PREFIX = '/p/';
  const view = document.getElementById('view');
  const addr = document.getElementById('addr');
  const home = document.getElementById('home');

  if (location.protocol === 'file:') document.getElementById('fileWarn').style.display = 'block';

  function toTarget(input) {
    const s = input.trim();
    if (!s) return null;
    if (/^https?:\/\//i.test(s)) return s;
    if (!/\s/.test(s) && /^[^\s]+\.[a-z]{2,}(?::\d+)?(\/.*)?$/i.test(s)) return 'https://' + s;
    if (/^localhost(:\d+)?(\/.*)?$/i.test(s)) return 'http://' + s;
    return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(s);
  }

  function open(url) {
    home.style.display = 'none';
    view.style.display = 'block';
    addr.value = url;
    view.src = PREFIX + url;
    history.replaceState(null, '', '#' + url);
  }

  function goHome() {
    view.removeAttribute('src');
    view.style.display = 'none';
    home.style.display = 'flex';
    addr.value = '';
    history.replaceState(null, '', location.pathname);
    addr.focus();
  }

  document.getElementById('go').addEventListener('submit', e => {
    e.preventDefault();
    const t = toTarget(addr.value);
    if (t) open(t);
  });

  document.querySelectorAll('.links a').forEach(a =>
    a.addEventListener('click', e => { e.preventDefault(); open(a.dataset.url); }));

  // Keep the address bar in sync with whatever the frame navigated to.
  view.addEventListener('load', () => {
    try {
      const loc = view.contentWindow.location;
      if (loc.pathname.startsWith(PREFIX)) {
        const url = loc.pathname.slice(PREFIX.length) + loc.search + loc.hash;
        addr.value = url;
        history.replaceState(null, '', '#' + url);
        document.title = (view.contentDocument.title || url) + ' — Local Proxy';
      }
    } catch (_) { /* frame left the proxy; nothing to read */ }
  });

  const frameHistory = fn => { try { fn(view.contentWindow.history); } catch (_) {} };
  document.getElementById('back').onclick = () => frameHistory(h => h.back());
  document.getElementById('fwd').onclick = () => frameHistory(h => h.forward());
  document.getElementById('reload').onclick = () => { try { view.contentWindow.location.reload(); } catch (_) {} };
  document.getElementById('homeBtn').onclick = goHome;
  document.getElementById('popout').onclick = () => {
    const t = toTarget(addr.value);
    if (t) window.open(PREFIX + t, '_blank');
  };

  // Reopen the last page after a refresh (URL is kept in the #hash).
  if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
