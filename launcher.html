<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proxy Launcher</title>
<style>
  :root {
    --bg: #f4f4f5; --card: #ffffff; --text: #18181b; --muted: #71717a;
    --border: #e4e4e7; --accent: #2563eb; --accent-text: #ffffff; --input: #f4f4f5;
    --ok: #15803d; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b; --card: #18181b; --text: #fafafa; --muted: #a1a1aa;
      --border: #27272a; --accent: #3b82f6; --input: #27272a; --ok: #4ade80; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; display: grid; gap: 16px; }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 4px; font-weight: 550; font-size: 14px; }
  input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--input); color: var(--text); outline: none; width: 100%; }
  input:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }
  button { font: inherit; font-weight: 600; padding: 11px; border-radius: 10px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-text); }
  button.secondary { background: var(--input); color: var(--text); }
  .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #status { min-height: 1.5em; font-size: 14px; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  details { color: var(--muted); font-size: 14px; }
  summary { cursor: pointer; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Proxy Launcher</h1>
    <p>Start the proxy on your phone first (<code>python3 proxy.py --share</code>), then fill this in once.</p>

    <div class="row">
      <label>Phone address <input id="host" placeholder="172.20.10.1" autocomplete="off" spellcheck="false"></label>
      <label>Port <input id="port" inputmode="numeric" placeholder="8080"></label>
    </div>
    <label>Key <input id="key" placeholder="shown on your phone" autocomplete="off" spellcheck="false"></label>
    <label>Go to (optional) <input id="url" placeholder="e.g. wikipedia.org" autocomplete="off" spellcheck="false"></label>

    <div class="buttons">
      <button type="button" class="secondary" id="test">Test connection</button>
      <button type="submit">Open proxy</button>
    </div>
    <div id="status"></div>

    <details>
      <summary>Where do I find the address?</summary>
      <p>It's in the link your phone prints, between <code>http://</code> and <code>:8080</code>.
      If the Chromebook is on your iPhone's Personal Hotspot, it's always <code>172.20.10.1</code>.</p>
    </details>
  </form>

<script>
  const $ = id => document.getElementById(id);
  const fields = ['host', 'port', 'key'];
  const status = (msg, cls) => { $('status').textContent = msg; $('status').className = cls || ''; };

  // Remember the settings on this Chromebook.
  try {
    const saved = JSON.parse(localStorage.getItem('proxy-launcher') || '{}');
    fields.forEach(f => { if (saved[f]) $(f).value = saved[f]; });
  } catch (_) {}
  if (!$('host').value) $('host').value = '172.20.10.1';
  if (!$('port').value) $('port').value = '8080';

  function base() {
    let host = $('host').value.trim().replace(/^https?:\/\//i, '').replace(/[:/].*$/, '');
    const port = $('port').value.trim() || '8080';
    try { localStorage.setItem('proxy-launcher', JSON.stringify({ host, port, key: $('key').value.trim() })); } catch (_) {}
    return host ? `http://${host}:${port}` : null;
  }

  $('test').onclick = async () => {
    const b = base();
    if (!b) return status('Enter your phone\'s address first.', 'bad');
    status('Checking…');
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      await fetch(b + '/', { mode: 'no-cors', signal: ctrl.signal, cache: 'no-store' });
      status('Connected. Your phone\'s proxy is reachable.', 'ok');
    } catch (_) {
      status('Can\'t reach the phone. Is the proxy running and are both on the same Wi-Fi or hotspot?', 'bad');
    } finally { clearTimeout(timer); }
  };

  $('form').onsubmit = e => {
    e.preventDefault();
    const b = base();
    if (!b) return status('Enter your phone\'s address first.', 'bad');
    const key = $('key').value.trim();
    let target = $('url').value.trim();
    if (target && !/^https?:\/\//i.test(target)) {
      target = /^\S+\.\S+$/.test(target)
        ? 'https://' + target
        : 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(target);
    }
    location.href = b + '/' + (key ? '?key=' + encodeURIComponent(key) : '') + (target ? '#' + target : '');
  };
</script>
</body>
</html>
